<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑白轉轉棋 (全盤連線解禁版)</title>
<style>
  :root { --cell-size: 45px; --disk-size: 36px; }
  body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
  .controls-card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.8); margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px; width: 90%; max-width: 700px; border: 2px solid #10b981;}
  .control-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: center; }
  .controls-card label { font-size: 15px; font-weight: bold; cursor: pointer; color:#fff;}
  input[type="number"] { padding: 6px; font-size: 15px; text-align: center; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; outline: none; }
  #layer-settings { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; background: #0f172a; padding: 10px; border-radius: 8px; }
  .layer-config { background: #334155; color: #f8fafc; padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
  .layer-config select { padding: 2px; font-size: 13px; cursor: pointer; background: #1e293b; color: #fff; border: 1px solid #475569;}
  .layer-config select:disabled { cursor: not-allowed; opacity: 0.5; }
  
  .btn-primary { background-color: #10b981; color: #0f172a; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;}
  .btn-primary:hover { background-color: #059669; transform: translateY(-2px);}
  .btn-warning { background-color: #f59e0b; color: #0f172a; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;}
  .btn-warning:hover { background-color: #d97706; color: #fff;}
  .ai-toggle-container { display: flex; align-items: center; gap: 8px; background: #334155; padding: 6px 12px; border-radius: 8px; transition: 0.3s; user-select: none; border: 2px solid #475569;}
  .ai-toggle-container.active { background: #e94560; border-color: #fff; color: #fff; font-weight: bold;}
  .ai-toggle-container input { width: 18px; height: 18px; cursor: pointer; }

  #game-info { margin: 10px 0; font-size: 18px; display: flex; gap: 20px; }
  .score { display: flex; align-items: center; gap: 10px; font-weight: bold; padding: 6px 15px; border-radius: 8px; background-color: #1e293b; transition: 0.3s; }
  .active-player { background-color: #10b981; color: #0f172a; box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);}
  .disk-icon { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #94a3b8; }
  .black-icon { background-color: #111; border-color:#000; }
  .white-icon { background-color: #eee; border-color:#fff;}
  
  #board-container { margin: 10px 0; position: relative;}
  #board { display: grid; gap: 2px; background-color: #000; border: 4px solid #000; box-shadow: 0 8px 30px rgba(0,0,0,0.9); border-radius: 4px; }
  .cell { width: var(--cell-size); height: var(--cell-size); display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; transition: filter 0.3s;}
  .cell:hover { filter: brightness(1.3); }
  
  .disk { width: var(--disk-size); height: var(--disk-size); border-radius: 50%; box-shadow: 2px 2px 5px rgba(0,0,0,0.9); transition: transform 0.4s ease; }
  .black { background-color: #111; }
  .white { background-color: #eee; }
  
  .win-highlight { box-shadow: 0 0 15px 5px #e94560; border: 2px solid #e94560;}
  
  #message { margin-top: 15px; font-size: 20px; font-weight: bold; color: #10b981; height: 30px; text-align: center; text-shadow: 1px 1px 3px #000;}
  .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; z-index: 20; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: #e94560; text-shadow: 2px 2px 5px black; backdrop-filter: blur(2px); border-radius: 4px; flex-direction: column;}
</style>
</head>
<body>

<h1>黑白轉轉棋 (全盤連線解禁版)</h1>

<div class="controls-card">
  <div class="control-row">
    <label>棋盤邊長: <input type="number" id="board-size" value="8" min="4" max="14" style="width: 50px;" onchange="updateLayerSettingsUI()"></label>
    <label>連線目標: <input type="number" id="win-target" value="5" min="3" max="8" style="width: 50px;" onchange="initGame()"></label>
    <label class="ai-toggle-container" id="ai-label">
      <input type="checkbox" id="ai-toggle" onchange="handleAIToggle()">
      <span>💀 啟用深度 AI (白方)</span>
    </label>
  </div>
  <div style="text-align: center; font-size: 13px; margin-top: 5px; color:#94a3b8;">
    👇 <strong>每次落子後，所有圈層會「同時」移動一格 (全盤連線皆有效)</strong> 👇
  </div>
  <div id="layer-settings" style="margin-top:10px;"></div>

  <div class="control-row" style="margin-top: 5px;">
    <button class="btn-primary" onclick="initGame()">重新開始遊戲</button>
    <button class="btn-warning" onclick="undoMove()">↩ 悔棋</button>
  </div>
</div>

<div id="game-info">
  <div id="score-black" class="score"><div class="disk-icon black-icon"></div> 黑方: <span id="black-score">0</span></div>
  <div id="score-white" class="score"><div class="disk-icon white-icon"></div> 白方: <span id="white-score">0</span></div>
</div>

<div id="board-container">
  <div id="board"></div>
  <div class="overlay" id="ai-overlay">
    <div>AI 深度預判中...</div>
  </div>
</div>

<div id="message"></div>

<script>
  let BOARD_SIZE = 8;
  let WIN_TARGET = 5; 
  let board = [];
  let currentPlayer = 1; 
  let gamePhase = 'PLACE'; 
  let historyStack = [];
  let winCells = [];
  
  function getEl(id) { return document.getElementById(id); }

  function updateLayerSettingsUI() {
    let sizeInput = parseInt(getEl('board-size').value);
    if (sizeInput < 4) sizeInput = 4;
    let numLayers = Math.ceil(sizeInput / 2);
    let html = '';
    for (let l = 0; l < numLayers; l++) {
      html += `<div class="layer-config"> 第 ${l+1} 圈 
          <select id="layer-dir-${l}">
            <option value="CW">順時針 ↻</option>
            <option value="CCW">逆時針 ↺</option>
          </select></div>`;
    }
    getEl('layer-settings').innerHTML = html;
  }

  function handleAIToggle() {
    let aiEnabled = getEl('ai-toggle').checked;
    let label = getEl('ai-label');
    if (aiEnabled) {
      label.classList.add('active');
      if (currentPlayer === 2 && gamePhase === 'PLACE') aiPlay();
    } else {
      label.classList.remove('active');
    }
  }

  function initGame() {
    BOARD_SIZE = parseInt(getEl('board-size').value);
    WIN_TARGET = parseInt(getEl('win-target').value);
    
    // 防呆：連線目標不能大於棋盤大小
    if (WIN_TARGET > BOARD_SIZE) {
        WIN_TARGET = BOARD_SIZE;
        getEl('win-target').value = WIN_TARGET;
    }

    board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
    
    let maxBoardWidth = Math.min(window.innerWidth - 40, 500);
    let cellSize = Math.floor(maxBoardWidth / BOARD_SIZE);
    if (cellSize > 60) cellSize = 60;
    if (cellSize < 20) cellSize = 20;
    document.documentElement.style.setProperty('--cell-size', `${cellSize}px`);
    document.documentElement.style.setProperty('--disk-size', `${cellSize * 0.8}px`);
    
    currentPlayer = 1; gamePhase = 'PLACE'; historyStack = []; winCells = [];
    getEl('message').textContent = `目標：全盤達成 ${WIN_TARGET} 顆連線！`; 
    getEl('message').style.color = '#10b981';
    getEl('ai-overlay').style.display = 'none';
    getEl('board').style.gridTemplateColumns = `repeat(${BOARD_SIZE}, var(--cell-size))`;
    getEl('board').style.gridTemplateRows = `repeat(${BOARD_SIZE}, var(--cell-size))`;
    updateUI();
  }

  function saveState() {
    historyStack.push({ board: board.map(row => [...row]), currentPlayer: currentPlayer, gamePhase: 'PLACE' });
  }

  function undoMove() {
    if (historyStack.length === 0) return;
    let aiEnabled = getEl('ai-toggle').checked;
    if (aiEnabled && currentPlayer === 1 && historyStack.length >= 2) {
      historyStack.pop(); 
      let state = historyStack.pop(); 
      board = state.board; currentPlayer = state.currentPlayer;
    } else {
      let state = historyStack.pop();
      board = state.board; currentPlayer = state.currentPlayer;
    }
    gamePhase = 'PLACE'; winCells = []; updateUI();
    getEl('message').textContent = '已悔棋！';
  }

  function getLayer(r, c) { return Math.floor(Math.max(Math.abs(r - (BOARD_SIZE - 1) / 2), Math.abs(c - (BOARD_SIZE - 1) / 2))); }

  // 判斷連線勝利 (全盤解禁)
  function checkWin(testBoard) {
    let dirs = [[0, 1], [1, 0], [1, 1], [1, -1]]; 
    
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        let player = testBoard[r][c];
        if (player === 0) continue;
        
        for (let [dr, dc] of dirs) {
          let count = 1;
          let tempWinCells = [[r, c]];
          
          for (let i = 1; i < WIN_TARGET; i++) {
            let nr = r + dr * i;
            let nc = c + dc * i;
            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && testBoard[nr][nc] === player) {
              count++;
              tempWinCells.push([nr, nc]);
            } else {
              break;
            }
          }
          if (count >= WIN_TARGET) {
            return { winner: player, cells: tempWinCells };
          }
        }
      }
    }
    return null;
  }

  function handleCellClick(r, c) {
    if (gamePhase !== 'PLACE') return;
    if (getEl('ai-toggle').checked && currentPlayer === 2) return; 

    if (board[r][c] === 0) {
      gamePhase = 'ANIMATING'; 
      executeMove(r, c); 
    }
  }

  function rotateRingData(layer, dir, currentBoard = board) {
    let min = Math.floor((BOARD_SIZE - 1) / 2) - layer, max = Math.floor(BOARD_SIZE / 2) + layer;
    if (min >= max) return; 

    let coords = [];
    for (let c = min; c <= max; c++) coords.push([min, c]);
    for (let r = min + 1; r <= max; r++) coords.push([r, max]);
    for (let c = max - 1; c >= min; c--) coords.push([max, c]);
    for (let r = max - 1; r >= min + 1; r--) coords.push([r, min]);

    let values = coords.map(([r, c]) => currentBoard[r][c]);

    if (dir === 'CW') { 
      values.unshift(values.pop());
    } else { 
      values.push(values.shift());
    }

    for (let i = 0; i < coords.length; i++) {
      let [r, c] = coords[i];
      currentBoard[r][c] = values[i];
    }
  }

  function rotateAllRings(targetBoard) {
    let numLayers = Math.ceil(BOARD_SIZE / 2);
    for (let l = 0; l < numLayers; l++) {
      let dir = getEl(`layer-dir-${l}`).value;
      rotateRingData(l, dir, targetBoard);
    }
  }

  function executeMove(r, c) {
    saveState();
    board[r][c] = currentPlayer;
    updateUI(); 

    let winInfo = checkWin(board);
    if (winInfo) {
      winCells = winInfo.cells;
      endGame(winInfo.winner);
      return;
    }

    setTimeout(() => {
      rotateAllRings(board); 
      updateUI(); 
      getEl('message').textContent = `💥 全盤已移動一格！`;
      
      winInfo = checkWin(board);
      if (winInfo) {
        winCells = winInfo.cells;
        setTimeout(() => endGame(winInfo.winner), 300);
        return;
      }

      setTimeout(() => { endTurn(); }, 300);
    }, 600);
  }

  function endTurn() {
    currentPlayer = currentPlayer === 1 ? 2 : 1; 
    gamePhase = 'PLACE';
    
    let isFull = true;
    for (let r=0; r<BOARD_SIZE; r++) for (let c=0; c<BOARD_SIZE; c++) if (board[r][c] === 0) isFull = false;
    
    if (isFull) {
      getEl('message').textContent = '棋盤滿了，平手！';
      gamePhase = 'END';
      return;
    }
    
    updateUI();
    if (getEl('ai-toggle').checked && currentPlayer === 2 && gamePhase === 'PLACE') aiPlay();
  }

  function endGame(winner) {
    let msg = winner === 1 ? '🎉 黑方成功連線獲勝！' : '💀 深度 AI 絕殺連線！你輸了！';
    getEl('message').textContent = msg; 
    getEl('message').style.color = winner === 1 ? '#10b981' : '#e94560';
    gamePhase = 'END'; 
    updateUI();
  }
  
  // ==========================================
  // 🔥 AI 核心：深度預判引擎 🔥
  // ==========================================
  
  function evaluateLine(countAI, countOpp) {
    if (countAI > 0 && countOpp > 0) return 0; 
    if (countAI > 0) {
      if (countAI >= WIN_TARGET) return 10000000;
      if (countAI === WIN_TARGET - 1) return 50000; 
      return Math.pow(10, countAI); 
    }
    if (countOpp > 0) {
      if (countOpp >= WIN_TARGET) return -10000000;
      if (countOpp === WIN_TARGET - 1) return -100000; 
      return -Math.pow(10, countOpp);
    }
    return 0;
  }

  function evaluateBoardForConnect(testBoard) {
    let score = 0;
    let dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        for (let [dr, dc] of dirs) {
          let countAI = 0, countOpp = 0;
          let validLine = true;
          
          for (let i = 0; i < WIN_TARGET; i++) {
            let nr = r + dr * i;
            let nc = c + dc * i;
            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
              if (testBoard[nr][nc] === 2) countAI++;
              else if (testBoard[nr][nc] === 1) countOpp++;
            } else {
              validLine = false; break; 
            }
          }
          if (validLine) score += evaluateLine(countAI, countOpp);
        }
      }
    }
    return score;
  }

  function getRelevantMoves(currentBoard) {
    let moves = [];
    let hasPiece = false;
    for(let r=0; r<BOARD_SIZE; r++) {
      for(let c=0; c<BOARD_SIZE; c++) {
        if(currentBoard[r][c] !== 0) { hasPiece = true; continue; }
        
        let isNear = false;
        for(let dr=-2; dr<=2; dr++) {
          for(let dc=-2; dc<=2; dc++) {
            if(dr===0 && dc===0) continue;
            let nr=r+dr, nc=c+dc;
            if(nr>=0 && nr<BOARD_SIZE && nc>=0 && nc<BOARD_SIZE && currentBoard[nr][nc]!==0) {
              isNear = true; break;
            }
          }
          if(isNear) break;
        }
        if(isNear) moves.push({r, c});
      }
    }
    if(!hasPiece) return [{r: Math.floor(BOARD_SIZE/2), c: Math.floor(BOARD_SIZE/2)}];
    if(moves.length === 0) {
        for(let r=0; r<BOARD_SIZE; r++) for(let c=0; c<BOARD_SIZE; c++) if(currentBoard[r][c]===0) moves.push({r,c});
    }
    return moves;
  }

  function minimax(testBoard, depth, alpha, beta, maximizingPlayer) {
    let winInfo = checkWin(testBoard);
    if (winInfo) {
        if (winInfo.winner === 2) return 9999999 + depth; 
        else return -9999999 - depth; 
    }
    
    if (depth === 0) return evaluateBoardForConnect(testBoard);

    let moves = getRelevantMoves(testBoard);
    if (moves.length === 0) return 0; 

    if (maximizingPlayer) {
      let maxEval = -Infinity;
      for (let move of moves) {
        let nextBoard = testBoard.map(row => [...row]);
        nextBoard[move.r][move.c] = 2;
        rotateAllRings(nextBoard);
        
        let eval = minimax(nextBoard, depth - 1, alpha, beta, false);
        maxEval = Math.max(maxEval, eval);
        alpha = Math.max(alpha, eval);
        if (beta <= alpha) break; 
      }
      return maxEval;
    } else {
      let minEval = Infinity;
      for (let move of moves) {
        let nextBoard = testBoard.map(row => [...row]);
        nextBoard[move.r][move.c] = 1;
        rotateAllRings(nextBoard);
        
        let eval = minimax(nextBoard, depth - 1, alpha, beta, true);
        minEval = Math.min(minEval, eval);
        beta = Math.min(beta, eval);
        if (beta <= alpha) break; 
      }
      return minEval;
    }
  }

  function aiPlay() {
    if (!getEl('ai-toggle').checked) return;
    gamePhase = 'AI_THINKING'; updateUI();

    setTimeout(() => {
      let moves = getRelevantMoves(board);
      if (moves.length === 0) { endTurn(); return; }

      let bestScore = -Infinity;
      let bestMove = moves[0];
      
      let searchDepth = BOARD_SIZE <= 6 ? 3 : 2; 

      for (let move of moves) {
        let tempBoard = board.map(row => [...row]);
        tempBoard[move.r][move.c] = 2; 
        rotateAllRings(tempBoard); 

        let score = minimax(tempBoard, searchDepth - 1, -Infinity, Infinity, false);
        score += Math.random() * 2; 
        
        if (score > bestScore) {
          bestScore = score;
          bestMove = move;
        }
      }
      
      executeMove(bestMove.r, bestMove.c);
    }, 100);
  }

  function updateUI() {
    let bCount = 0, wCount = 0;
    getEl('board').innerHTML = '';

    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        let cell = document.createElement('div');
        let layerIndex = getLayer(r, c);
        
        cell.className = 'cell'; 
        cell.setAttribute('data-layer', layerIndex);
        
        let hue = 200, saturation = 60, lightness = 20 + (layerIndex * (25 / Math.ceil(BOARD_SIZE/2))); 
        cell.style.backgroundColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;

        cell.onclick = () => handleCellClick(r, c);
        
        let isWinCell = winCells.some(w => w[0] === r && w[1] === c);
        
        if (board[r][c] === 1) { 
          bCount++; 
          cell.innerHTML = `<div class="disk black ${isWinCell ? 'win-highlight' : ''}"></div>`; 
        } 
        else if (board[r][c] === 2) { 
          wCount++; 
          cell.innerHTML = `<div class="disk white ${isWinCell ? 'win-highlight' : ''}"></div>`; 
        } 
        getEl('board').appendChild(cell);
      }
    }
    
    getEl('black-score').textContent = bCount; getEl('white-score').textContent = wCount;
    getEl('score-black').className = 'score ' + (currentPlayer === 1 ? 'active-player' : '');
    getEl('score-white').className = 'score ' + (currentPlayer === 2 ? 'active-player' : '');
    
    let totalPieces = bCount + wCount;
    let selects = document.querySelectorAll('.layer-config select');
    selects.forEach(sel => sel.disabled = (totalPieces > 0));
    
    getEl('ai-overlay').style.display = (gamePhase === 'AI_THINKING') ? 'flex' : 'none';
  }

  window.onload = () => { updateLayerSettingsUI(); initGame(); };
  window.onresize = () => { if (board.length > 0) initGame(); }; 
</script>
</body>
</html>
